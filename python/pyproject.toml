[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-verify"
version = "0.1.0"
description = "Python shim for the aegis verification CLI: verify() + pytest plugin. Subprocess-only, no HTTP clients."
requires-python = ">=3.9"
license = { text = "MIT" }

[project.optional-dependencies]
pytest = ["pytest>=7"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.entry-points.pytest11]
aegis = "aegis.plugin"

[tool.setuptools]
packages = ["aegis"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# package name is aegis; tests may import test-only helpers freely
"tests/*" = ["B011"]
